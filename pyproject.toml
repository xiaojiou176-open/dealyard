[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dealwatcherer"
version = "1.0.1"
description = "Dealwatcher product backend and worker runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["dealwatcherer", "mcp", "price-tracking", "grocery", "fastapi", "preact"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "playwright==1.61.0",
  "pydantic~=2.13",
  "pydantic-settings~=2.14",
  "aiosqlite~=0.22.1",
  "PyYAML~=6.0",
  "fastapi~=0.141.1",
  "uvicorn~=0.52.0",
  "sqlalchemy~=2.0.51",
  "alembic~=1.18.5",
  "psycopg[binary]~=3.3.4",
  "httpx~=0.28.1",
  "tenacity~=9.1.4",
  "extruct~=0.18.0",
  "price-parser~=0.5.0",
  "rapidfuzz~=3.14.5",
  "selectolax~=0.4.11",
  "orjson~=3.11.9",
  "opentelemetry-api~=1.31.0",
  "opentelemetry-sdk~=1.31.0",
  "prometheus-client~=0.26.0",
  "apscheduler~=3.11.3",
  "python-multipart~=0.0.32",
  "email-validator~=2.3.0",
  "tzdata~=2026.3",
  "mcp>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://xiaojiou176-open.github.io/dealwatcherer/"
Repository = "https://github.com/xiaojiou176-open/dealwatcherer"
Documentation = "https://github.com/xiaojiou176-open/dealwatcherer/blob/main/docs/integrations/README.md"
Issues = "https://github.com/xiaojiou176-open/dealwatcherer/issues"
Discussions = "https://github.com/xiaojiou176-open/dealwatcherer/discussions"
Changelog = "https://github.com/xiaojiou176-open/dealwatcherer/releases"

[project.scripts]
dealwatcherer = "dealwatcherer.cli:main"
dealwatcherer-mcp = "dealwatcherer.mcp.server:main"

[dependency-groups]
dev = [
  "build==1.5.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff~=0.16.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dealwatcherer*"]
