schema_version: 1
name: dealwatcherer-readonly-builder
display_name: Dealwatcher Read-only Builder
version: 1.1.0
summary: >
  Public skill bundle for Dealwatcher that packages MCP install guidance, a
  read-only tool map, and a safe-first compare workflow for OpenHands/OpenClaw
  style hosts.
homepage: https://github.com/xiaojiou176-open/dealwatcherer
repository: https://github.com/xiaojiou176-open/dealwatcherer
license: MIT
authors:
  - name: Dealwatcher
entrypoints:
  skill_markdown: SKILL.md
compatibility:
  openhands:
    mode: skill directory plus published MCP config
    published_listing: false
  clawhub:
    mode: skill publish plus published MCP config
    published_listing: false
capabilities:
  - install the published Dealwatcher MCP package in host-specific config
  - expose the stable read-only Dealwatcher tool inventory
  - route builders into the safe-first runtime and compare path
  - preserve honest local-first boundary wording
boundaries:
  hosted_operator: false
  write_capable_mcp: false
  oauth_login: false
  official_listing_live: false
distribution_notes:
  current_claim: No fresh public ClawHub listing proof is currently available; other hosts should only claim submission or live state when independently confirmed.
verification:
  repo_commands:
    - python3 scripts/verify_public_surface.py
    - python3 scripts/verify_docs_contract.py
    - python3 scripts/verify_browser_extension_surface.py
    - GITHUB_TOKEN="$(gh auth token)" python3 scripts/verify_remote_github_state.py
    - uvx --from dealwatcherer==1.0.1 dealwatcherer-mcp list-tools --json
